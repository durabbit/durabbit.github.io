<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DURO ♡ Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FCA5A5;--pink-soft:#FBDCDC;--cream-white:#FFF4F2;
    --yellow-cream:#FCE19A;--yellow-bright:#F7CE46;
    --ink:#9c7d7d;--ink-deep:#7a5d5d;--white:#fffdfb;
    --soft:0 10px 26px rgba(252,165,165,.30);
    --soft-sm:0 6px 16px rgba(252,165,165,.26);
    --soft-yellow:0 10px 26px rgba(247,206,70,.32);
    --r-lg:30px;--r-md:24px;--r-sm:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Fredoka',sans-serif;color:var(--ink-deep);background:
    radial-gradient(circle at 15% 15%, #fff, transparent 45%),
    radial-gradient(circle at 85% 10%, var(--pink-soft), transparent 40%),
    linear-gradient(160deg,var(--cream-white),#fde6e6);
    min-height:100vh;overflow-x:hidden;line-height:1.6;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;position:relative;z-index:2;}

  /* nav */
  nav{display:flex;align-items:center;justify-content:center;padding:26px 0;}
  .logo{font-family:'Baloo 2';font-weight:800;font-size:1.6rem;color:var(--coral);display:flex;align-items:center;gap:8px;}

  /* hero */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:30px 0 60px;}
  .hero-img{background:var(--pink-soft);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--soft);aspect-ratio:4/5;display:flex;align-items:flex-end;justify-content:center;}
  .hero-img img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .hero-right{text-align:left;}
  .badge{display:inline-block;background:var(--yellow-bright);color:var(--ink-deep);font-family:'Baloo 2';font-weight:700;font-size:.9rem;letter-spacing:1.5px;padding:11px 26px;border-radius:999px;box-shadow:var(--soft-yellow);margin-bottom:22px;}
  .bigname{font-family:'Baloo 2';font-weight:800;font-size:clamp(4rem,11vw,7rem);color:var(--coral);line-height:.9;text-shadow:0 6px 0 #fbbcbc,0 12px 22px rgba(252,165,165,.4);}
  .kr-name{display:block;font-family:'Baloo 2';font-weight:800;font-size:clamp(2.4rem,6vw,3.4rem);color:#fff;-webkit-text-stroke:6px var(--coral);paint-order:stroke fill;text-shadow:0 5px 0 rgba(252,165,165,.4);transform:rotate(-8deg);margin:14px 0 6px 10px;line-height:1;}
  .heart-row{font-size:1.4rem;margin:10px 0 14px;}
  .hero-right .role{font-family:'Baloo 2';font-weight:700;font-size:1.3rem;color:var(--ink-deep);margin-top:6px;}

  /* coming soon */
  .coming{text-align:center;padding:30px 0 80px;}
  .coming .cs-card{background:var(--white);border-radius:var(--r-lg);box-shadow:var(--soft);padding:48px 30px;max-width:680px;margin:0 auto;border:3px solid var(--pink-soft);}
  .cs-title{font-family:'Baloo 2';font-weight:800;font-size:clamp(2.4rem,7vw,3.6rem);color:var(--coral);text-shadow:0 4px 0 #fbbcbc;}
  .cs-sub{color:var(--ink);font-size:1.05rem;margin-top:14px;}
  .cs-dots{margin-top:24px;display:flex;gap:10px;justify-content:center;}
  .cs-dots span{width:14px;height:14px;border-radius:50%;background:var(--coral);animation:bounce 1.2s ease-in-out infinite;}
  .cs-dots span:nth-child(2){background:var(--yellow-bright);animation-delay:.2s;}
  .cs-dots span:nth-child(3){background:var(--pink-soft);animation-delay:.4s;}
  @keyframes bounce{0%,100%{transform:translateY(0);opacity:.7;}50%{transform:translateY(-12px);opacity:1;}}
  .cs-link{display:inline-block;margin-top:30px;background:var(--coral);color:#fff;font-family:'Baloo 2';font-weight:700;font-size:1rem;padding:14px 34px;border-radius:999px;text-decoration:none;box-shadow:0 8px 18px rgba(252,165,165,.5);transition:.2s;}
  .cs-link:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(252,165,165,.6);}

  footer{text-align:center;padding:30px 20px 50px;color:var(--ink);font-size:.85rem;}

  @media(max-width:760px){
    .hero{grid-template-columns:1fr;gap:24px;text-align:center;}
    .hero-right{text-align:center;}
    .kr-name{margin-left:0;}
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="logo">🐰 DURO</div>
  </nav>

  <section class="hero">
    <div class="hero-img">
      <img src="durohero.png" alt="Duro lifting the LCK trophy">
    </div>
    <div class="hero-right">
      <div class="badge">★ 4TH ANNIVERSARY · PRO DEBUT ★</div>
      <h1 class="bigname">DURO</h1>
      <span class="kr-name">주민규</span>
      <div class="heart-row">🐰 ♡ 🐰</div>
      <p class="role">Joo Min-kyu · Gen.G Support</p>
      <p class="role">4 Years on the Pro Stage</p>
    </div>
  </section>

  <section class="coming">
    <div class="cs-card">
      <h2 class="cs-title">Coming Soon 🐰</h2>
      <p class="cs-sub">Trang fan dành cho Duro đang được hoàn thiện.<br>Hẹn gặp lại bạn thật sớm nhé! 💛</p>
      <div class="cs-dots"><span></span><span></span><span></span></div>
      <a class="cs-link" href="pray.html">🕯️ Cầu nguyện cho Gen.G →</a>
    </div>
  </section>
</div>

<footer>
  Fan-made page · không liên kết chính thức với Gen.G hay LCK 🐰💛
</footer>

</body>
</html>
